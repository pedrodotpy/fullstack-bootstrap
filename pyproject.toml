[project]
name = "fullstack-bootstrap"
version = "0.1.0"
description = "Deterministic fullstack project bootstrap from pinned Django and React boilerplates"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
fullstack-bootstrap = "fullstack_bootstrap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fullstack_bootstrap"]

[tool.hatch.build.targets.wheel.force-include]
"specs" = "fullstack_bootstrap/data/specs"
"support" = "fullstack_bootstrap/data/support"
"template-sources.toml" = "fullstack_bootstrap/data/template-sources.toml"

[tool.hatch.build.targets.sdist]
include = [
  "src/fullstack_bootstrap",
  "specs",
  "support",
  "template-sources.toml",
  "README.md",
  "pyproject.toml",
  "tests",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
